# 締めの実走ハーネス（tests/closing/run-closing.sh）の設定値＝後から変えたくなる値の置き場（1 か所）。
# 環境変数で同名を渡せば上書きできる（例: CLOSING_MOVES_REL=core/data/moves.tsv bash run-closing.sh …）。
# shellcheck shell=bash

# --- FX-1 側の Core データ（実装計画 §2）
: "${CLOSING_MOVES_REL:=core/data/moves.tsv}"     # 移動表（列＝旧パス・新パス・種別・転送印）
: "${CLOSING_LEDGER_REL:=core/data/ledger.tsv}"   # 台帳（列＝種類・パス・機能・層・提供元・鍵・備考）
: "${CLOSING_LEDGER_SUITE_KIND:=suite}"           # 台帳の「種類」列でスイート行を表す値
: "${CLOSING_LEDGER_PART_KIND:=part}"             # 同・部品行
: "${CLOSING_CORE_FN:=core}"                      # 機能名（台帳の機能列の値）
# FX-9a〜d で 1 つずつ除く機能（a＝AI Brain・b＝Team・c＝Usage・d＝Dock の順。値＝台帳の機能列＝機能フォルダ名）
: "${CLOSING_RM_FNS:=ai-brain team usage dock}"

# --- FX-10（偽 zz-cli 接続・設計 §10.3）
: "${CLOSING_ZZ_DIR_REL:=ai-brain/connect/zz-cli}"   # 接続フォルダ（<AI Brain>/<接続>/zz-cli）
: "${CLOSING_ZZ_FN:=ai-brain}"
: "${CLOSING_ZZ_LAYER:=connect}"
: "${CLOSING_ZZ_PROVIDER:=zz-cli}"

# --- 基準での入口の名前（FX-26 の入口・AC-9 の外部参照。FX-1 側は移動表で引く）
: "${CLOSING_RECALL_OLD:=claude/hooks/vault-recall.sh}"
: "${CLOSING_BOOTSTRAP_OLD:=claude/hooks/bootstrap-vault.sh}"
: "${CLOSING_BACKUP_OLD:=scripts/backup-vault.sh}"
: "${CLOSING_MAINT_OLD:=scripts/maintenance.sh}"
: "${CLOSING_CLAUDE_EXEC_OLD:=scripts/claude-exec.sh}"
: "${CLOSING_USAGE_FETCH_OLD:=scripts/usage-fetch.sh}"
: "${CLOSING_DOCK_OLD:=cmux/cmux-next-model.sh cmux/cmux-task-model.sh}"   # dotfiles の既定供給パス 2 本
: "${CLOSING_LA_TARGETS_OLD:=scripts/backup-vault.sh scripts/maintenance.sh scripts/usage-fetch.sh}"
: "${CLOSING_UPDATE_SUB_OLD:=scripts/update-sub.sh}"   # 現行のサブ機更新コマンド
: "${CLOSING_UPDATE_SUB_CALLS:=scripts/install-sub.sh vault-public/Preferences}"   # 同コマンドが pull 後に固定で名指すパス

# --- 基準側に当てる旧→新パス置換の補足（移動表に無いフォルダ単位の対応・空白区切りの 旧/=新/）。
#     scripts/vault-agents/ は中身が実行器と data に分かれ移動表にフォルダ行が無い＝自分の置き場を書く出力（vault_inventory の報告）を潰すため（リーダー裁定）。
#     個別ファイルは移動表のファイル行が先に当たる（長い旧パスから当てる）。
: "${CLOSING_BASE_MOVES_EXTRA:=scripts/vault-agents/=ai-brain/executor/}"

# --- 導入手順（基準での名前。FX-1 側は各パスを移動表で引く＝契約は lib-closing.sh 冒頭）
: "${CLOSING_PROFILE_SAMPLE_OLD:=config/profile.md.sample}"
: "${CLOSING_MODELS_SAMPLE_OLD:=config/models.conf.sample}"
: "${CLOSING_INSTALL_MAIN_OLD:=scripts/install-main.sh}"
: "${CLOSING_INSTALL_SUB_OLD:=scripts/install-sub.sh}"
: "${CLOSING_INSTALL_LA_OLD:=scripts/install-backup.sh scripts/install-maintenance.sh scripts/install-usage-fetch.sh}"
: "${CLOSING_CHECK_DRIFT_OLD:=scripts/check-drift.sh}"
: "${CLOSING_IMPORT_PULL:=git pull --ff-only}"            # メイン機の取込み手順の 1 段目（README のまま）

# --- README との照合（C-2）: ハーネスの手順の定数を、その側の README（英日）の印の直後の ```sh ブロックと突合する。
#     印＝見出し行そのもの（英|日）。照合するのは repo のコマンド行＝`cp <見本>`・`<…>.sh [引数]`・取込みの pull だけ
#     （git clone・cd・mkdir はハーネスの用意が担う）。印かブロックが無ければ NG。
: "${CLOSING_README_MARK_MAIN:=#### Main environment|#### メイン環境}"
: "${CLOSING_README_MARK_SUB:=#### Sub environment|#### サブ環境}"
: "${CLOSING_README_MARK_IMPORT:=##### Taking in v1.1 on an existing main machine|##### 既存メイン機の v1.1 取込み手順}"
#     README にあるがハーネスが実行しないもの＝照合から外す（--dry-run の行＝状態表示だけ・--with-dotfiles 引数＝別部品の導入で実通信と
#     実 dotfiles を伴い隔離できない）。外したものは報告の未解決点に残す。
: "${CLOSING_README_SKIP_LINE_ARGS:=--dry-run}"
: "${CLOSING_README_DROP_ARGS:=--with-dotfiles}"
: "${CLOSING_CONFIG_DIR_REL:=.config/takumi009-ai-env}"   # HOME 相対
: "${CLOSING_REPO_HOME_REL:=work/takumi009-ai-env}"       # HOME 相対の repo 置き場（README の clone 先）

# --- ライブ位置（AC-8。HOME 相対）
: "${CLOSING_LIVE_DIRS:=.claude/hooks .claude/agents}"
: "${CLOSING_LIVE_FILES:=.claude/settings.json .codex/AGENTS.md .codex/config.toml .codex/hooks.json}"
: "${CLOSING_LA_DIR_REL:=Library/LaunchAgents}"
: "${CLOSING_LA_PLISTS:=com.takumi009.backup-vault.plist com.takumi009.maintenance.plist com.takumi009.usage-fetch.plist}"

# --- 実行環境（FX-6）
: "${CLOSING_BASE_PATH:=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin}"  # claude・codex を含まないこと（起動時に検査）
: "${CLOSING_LANG:=${LANG:-ja_JP.UTF-8}}"
: "${CLOSING_GIT_NAME:=closing-harness}"
: "${CLOSING_GIT_EMAIL:=closing-harness@example.invalid}"
: "${CLOSING_VAULT_REL:=Data/obsidian}"                # HOME 相対の Vault 置き場（各入口の既定）

# --- AC-10 ③ FX-23（インストーラの途中失敗）＝偽 ln が N 回を超えた呼び出しから非 0。
#     基準の実測＝更新コマンドのロック取得（pid-lock）で 1 回・以後は配置の symlink＝既定 3 は配置の 3 本目で止まる。
: "${CLOSING_IFAIL_LN_OK_CALLS:=3}"

# --- AC-9 の Vault Preferences（読み取りだけ）
: "${CLOSING_PREFS_GLOB:=$HOME/Data/obsidian/Preferences/*.md}"

# --- 出力
: "${CLOSING_OUT_ROOT:=}"   # 空＝tests/closing/out
