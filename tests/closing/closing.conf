# 締めの実走ハーネス（tests/closing/run-closing.sh）の設定値＝後から変えたくなる値の置き場（1 か所）。
# 環境変数で同名を渡せば上書きできる（例: CLOSING_MOVES_REL=core/data/moves.tsv bash run-closing.sh …）。
# shellcheck shell=bash

# --- FX-1 側の Core データ（実装計画 §2）
: "${CLOSING_MOVES_REL:=core/data/moves.tsv}"     # 移動表（列＝旧パス・新パス・種別・転送印）
: "${CLOSING_LEDGER_REL:=core/data/ledger.tsv}"   # 台帳（列＝種類・パス・機能・層・提供元・鍵・備考）
: "${CLOSING_LEDGER_SUITE_KIND:=suite}"           # 台帳の「種類」列でスイート行を表す値
: "${CLOSING_LEDGER_PART_KIND:=part}"             # 同・部品行
: "${CLOSING_LEDGER_NOTIFY_KIND:=notify}"         # 同・Notify 所在の行
: "${CLOSING_CORE_FN:=core}"                      # 機能名（台帳の機能列の値）
# FX-9a〜d で 1 つずつ除く機能（a＝AI Brain・b＝Team・c＝Usage・d＝Dock の順。値＝台帳の機能列＝機能フォルダ名）。
#   除くもの＝機能フォルダ・その機能のスイート・台帳のその機能の行（part・suite・notify）。移動表は触らない（リーダー裁定）。
: "${CLOSING_RM_FNS:=ai-brain team usage dock}"

# --- FX-10（偽 zz-cli 接続・設計 §10.3）
: "${CLOSING_ZZ_DIR_REL:=ai-brain/connect/zz-cli}"   # 接続フォルダ（<AI Brain>/<接続>/zz-cli）
: "${CLOSING_ZZ_FN:=ai-brain}"
: "${CLOSING_ZZ_LAYER:=connect}"
: "${CLOSING_ZZ_PROVIDER:=zz-cli}"

# --- 基準での入口の名前（FX-26 の入口・AC-9 の外部参照。FX-1 側は移動表で引く）。
#     v1.2 の基準＝FX-2＝main 0a86db1（post-v1.1）＝着手ゲート B1 の実測でこの表の値を現行名へ更新した
#     （旧 v1.1 の「old」＝pre-v1.1 の名は基準 0a86db1 にもう存在しない＝scripts/・config/ の大半は移動表の転送
#     symlink も張られていない。README「Main/Sub environment」の ```sh ブロックと一致させた）。
: "${CLOSING_RECALL_OLD:=claude/hooks/vault-recall.sh}"
: "${CLOSING_BOOTSTRAP_OLD:=claude/hooks/bootstrap-vault.sh}"
: "${CLOSING_BACKUP_OLD:=ai-brain/executor/backup-vault.sh}"
: "${CLOSING_MAINT_OLD:=ai-brain/executor/maintenance.sh}"
: "${CLOSING_CLAUDE_EXEC_OLD:=team/connect/claude-code/claude-exec.sh}"
: "${CLOSING_USAGE_FETCH_OLD:=usage/executor/usage-fetch.sh}"
: "${CLOSING_DOCK_OLD:=cmux/cmux-next-model.sh cmux/cmux-task-model.sh}"   # dotfiles の既定供給パス 2 本（dotfiles 側は不変）
: "${CLOSING_LA_TARGETS_OLD:=ai-brain/executor/backup-vault.sh ai-brain/executor/maintenance.sh usage/executor/usage-fetch.sh}"
: "${CLOSING_UPDATE_SUB_OLD:=core/assembly/update-sub.sh}"   # 現行のサブ機更新コマンド
: "${CLOSING_UPDATE_SUB_CALLS:=core/assembly/install-sub.sh ai-brain/data/vault-public/Preferences}"   # 同コマンドが pull 後に固定で名指すパス

# --- 基準側に当てる旧→新パス置換の補足（移動表に無いフォルダ単位の対応・空白区切りの 旧/=新/）。
#     v1.2 の基準（0a86db1）には該当しない（v1.1 の移行は完了済み）＝空のまま。
: "${CLOSING_BASE_MOVES_EXTRA:=}"

# --- 導入手順（基準での名前。FX-1 側は各パスを移動表で引く＝契約は lib-closing.sh 冒頭）
: "${CLOSING_PROFILE_SAMPLE_OLD:=team/data/profile.md.sample}"
: "${CLOSING_MODELS_SAMPLE_OLD:=team/data/models.conf.sample}"
: "${CLOSING_INSTALL_MAIN_OLD:=core/assembly/install-main.sh}"
: "${CLOSING_INSTALL_SUB_OLD:=core/assembly/install-sub.sh}"
: "${CLOSING_INSTALL_LA_OLD:=ai-brain/assembly/install-backup.sh ai-brain/assembly/install-maintenance.sh usage/assembly/install-usage-fetch.sh}"
: "${CLOSING_CHECK_DRIFT_OLD:=core/assembly/check-drift.sh}"
: "${CLOSING_IMPORT_PULL:=git pull --ff-only}"            # メイン機の取込み手順の 1 段目（README のまま）

# --- README との照合（C-2）: ハーネスの手順の定数を、その側の README（英日）の印の直後の ```sh ブロックと突合する。
#     印＝見出し行そのもの（英|日）。照合するのは repo のコマンド行＝`cp <見本>`・`<…>.sh [引数]`・取込みの pull だけ
#     （git clone・cd・mkdir はハーネスの用意が担う）。印かブロックが無ければ NG。
: "${CLOSING_README_MARK_MAIN:=#### Main environment|#### メイン環境}"
: "${CLOSING_README_MARK_SUB:=#### Sub environment|#### サブ環境}"
: "${CLOSING_README_MARK_IMPORT:=##### Taking in v1.1 on an existing main machine|##### 既存メイン機の v1.1 取込み手順}"
#     README にあるがハーネスが実行しないもの＝照合から外す（--dry-run の行＝状態表示だけ・--with-dotfiles 引数＝別部品の導入で実通信と
#     実 dotfiles を伴い隔離できない）。外したものは報告の未解決点に残す。
: "${CLOSING_README_SKIP_LINE_ARGS:=--dry-run}"
: "${CLOSING_README_DROP_ARGS:=--with-dotfiles}"
: "${CLOSING_CONFIG_DIR_REL:=.config/takumi009-ai-env}"   # HOME 相対
: "${CLOSING_REPO_HOME_REL:=work/takumi009-ai-env}"       # HOME 相対の repo 置き場（README の clone 先）

# --- AC-8 ③ settings.json で FX-1 にだけあってよい登録のライブ名（空白区切り・フックのライブ置き場直下の名前）。
#     要件 NFR-1「足してよい名前は結合の解消で分けた部品の分だけ」＝設計 D-9 の新ライブ名 1 本（リーダー裁定）。
: "${CLOSING_AC8_ALLOWED_EXTRA:=codex-direct-call-gate.sh}"

# --- ライブ位置（AC-8。HOME 相対）
: "${CLOSING_LIVE_DIRS:=.claude/hooks .claude/agents}"
: "${CLOSING_LIVE_FILES:=.claude/settings.json .codex/AGENTS.md .codex/config.toml .codex/hooks.json}"
: "${CLOSING_LA_DIR_REL:=Library/LaunchAgents}"
: "${CLOSING_LA_PLISTS:=com.takumi009.backup-vault.plist com.takumi009.maintenance.plist com.takumi009.usage-fetch.plist}"

# --- 実行環境（FX-6）
: "${CLOSING_BASE_PATH:=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin}"  # claude・codex を含まないこと（起動時に検査）
: "${CLOSING_LANG:=${LANG:-ja_JP.UTF-8}}"
: "${CLOSING_GIT_NAME:=closing-harness}"
: "${CLOSING_GIT_EMAIL:=closing-harness@example.invalid}"
: "${CLOSING_VAULT_REL:=Data/obsidian}"                # HOME 相対の Vault 置き場（各入口の既定）

# --- AC-10 ③ FX-23（インストーラの途中失敗）＝偽 ln が N 回を超えた呼び出しから非 0。
#     基準の実測＝更新コマンドのロック取得（pid-lock）で 1 回・以後は配置の symlink＝既定 3 は配置の 3 本目で止まる。
: "${CLOSING_IFAIL_LN_OK_CALLS:=3}"

# --- AC-9 の Vault Preferences（読み取りだけ）
: "${CLOSING_PREFS_GLOB:=$HOME/Data/obsidian/Preferences/*.md}"

# --- v1.2 束 B（口・発する側・NG 語・台帳検査・所要時間）。実名は実装計画 v1.3 §1（B2 で確認済み）。
: "${CLOSING_NOTIFY_SH_REL:=notify/executor/notify.sh}"              # 口
: "${CLOSING_NOTIFY_FN:=notify}"                                     # 台帳の機能名
: "${CLOSING_NOTICE_SH_REL:=core/executor/notice.sh}"                 # 知らせの共通部品
: "${CLOSING_PROMPT_ANSWER_REL:=core/connect/claude-code/prompt-answer.sh}"  # 入力検知（旧 code27-call-clear.sh の判定部分）
: "${CLOSING_PROMPT_ANSWER_LIVE:=claude/hooks/code27-call-clear.sh}"  # ライブ名は不変（NFR-1）
: "${CLOSING_USAGE_NOTIFY_REL:=usage/executor/usage-notify.sh}"       # Usage の通知の判定（旧 notify/connect/macos/usage-notify.sh）
: "${CLOSING_LEDGER_TOOL_REL:=core/assembly/ledger-tool.sh}"
: "${CLOSING_NOTIFY_WAIT_ENV:=AIENV_NOTIFY_WAIT_SECS}"                # 待つ上限 T（既定 5 秒）
: "${CLOSING_NOTIFY_WAIT_SECS_DEFAULT:=5}"                            # T の既定値（口の既定と同じ・設計 §4）
: "${CLOSING_NOTIFY_OBSERVE_SECS:=$((CLOSING_NOTIFY_WAIT_SECS_DEFAULT + 1))}"  # 切り離した口の記録を待つ上限＝T＋1 秒
: "${CLOSING_NOTIFY_LOG_ENV:=AIENV_NOTIFY_LOG}"                       # 知らせの記録（既定 $HOME/.claude/logs/notify.tsv）
: "${CLOSING_NOTIFY_LOG_REL:=.claude/logs/notify.tsv}"                # HOME 相対の既定
: "${CLOSING_TIMING_TIMEOUT_ENV:=AIENV_TIMING_RUN_TIMEOUT_SECS}"      # 所要時間の実行タイムアウト（既定 30 秒）
# 新既定（束 B 時点＝8 列目「知らせ」。CLOSING_LEDGER_NOTIFY_KIND は所在行の種類＝既存のまま再利用）
: "${CLOSING_LEDGER_CORE_FN:=core}"

# --- FX-11（第 4 の届け先 zz-dest・共有雛形 tests/fixtures/zz-dest/・使い方は同ディレクトリの README.md）
: "${CLOSING_ZZD_DIR_REL:=notify/connect/zz-dest}"
: "${CLOSING_ZZD_PROVIDER:=zz-dest}"
: "${CLOSING_ZZD_FIX_REL:=tests/fixtures/zz-dest}"

# --- FX-9（発する側の入力 4 群）の固定文言
: "${CLOSING_FX9_ANNOUNCE_TITLE:=📣 テスト呼出}"
: "${CLOSING_FX9_ANNOUNCE_BODY:=本文}"
: "${CLOSING_FX9_UPS_POS:=了解}"
: "${CLOSING_FX9_UPS_EXCLUDED:=<task-notification>x}"
# JSON 中の { } " を ${VAR:=...} の既定値に直接書くと bash の展開がそこで終端してしまう
# （実測＝AC-4 の usage が parse_error になっていた）ので、素の代入ガードにする。
[ -n "${CLOSING_USAGE_WARN_BODY:-}" ] || CLOSING_USAGE_WARN_BODY='{"five_hour":{"used_percent":85,"resets_at":"2026-09-09T00:00:00Z"},"seven_day":{"used_percent":85,"resets_at":"2026-09-14T00:00:00Z"}}'

# --- 共有雛形（tests/fixtures/code27-call/・使い方は同ディレクトリの README.md）
: "${CLOSING_CODE27_FIX_REL:=tests/fixtures/code27-call}"

# --- 出力
: "${CLOSING_OUT_ROOT:=}"   # 空＝tests/closing/out
